services:

#ROUTER
  router:
    build: ./docker/router
    hostname: router
    container_name: router
    networks:
      red_wan:
        ipv4_address: 192.168.200.254
        interface_name: eth0 
      red_stark_net:
        ipv4_address: 192.168.10.254  
        interface_name:  eth1 
      red_lannister_net:
        ipv4_address: 192.168.11.254
        interface_name: eth2
      red_targaryen_net:
        ipv4_address: 192.168.12.254
        interface_name: eth3
    cap_add:
      - NET_ADMIN
  #arya:
  arya:
    build: ./docker/dnsserver
    hostname: arya
    environment:
      - GATEWAY=192.168.10.254
    container_name: dnsserver
    networks:
      red_stark_net:
        ipv4_address: 192.168.10.10  
    volumes:
      - ./arya/named.conf.local:/etc/bind/named.conf.local
      - ./arya/zonas:/var/cache/bind/zonas 
    cap_add:
      - NET_ADMIN
             
  #KEA
  ned:
    build: ./docker/kea
    container_name: kea
    hostname: ned
    networks:
      red_stark_net:
        ipv4_address: 192.168.10.2
    volumes:
      - ./ned/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf
      - ./log:/var/log/kea
      - ./ned/kea-dhcp-ddns.conf.json:/etc/kea/kea-dhcp-ddns.conf
    cap_add:
      - NET_ADMIN
  
  #CLIENTES STARK
  bran:
    build: ./docker/cliente
    container_name: cliente1
    networks:
      red_stark_net:
        ipv4_address: 192.168.10.11
        mac_address: 02:42:ac:11:00:10  # dirección HW fija

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  jon:
    build: ./docker/cliente
    container_name: cliente2
    networks:
      red_stark_net:
    
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  sansa:
    build: ./docker/cliente
    container_name: cliente3
    networks:
      red_stark_net:
       
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  robb:
    build: ./docker/cliente
    container_name: cliente4
    networks:
      red_stark_net:
        
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  # Cliente Red Lannister
  jamie:
    build: ./docker/cliente
    container_name: cliente5
    networks:
      red_lannister_net:
        
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  # Cliente Red Targaryen
  daenerys:
    build: ./docker/cliente
    container_name: cliente6
    networks:
      red_targaryen_net:

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned
      
#REDES    
networks:
  red_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
  red_stark_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  red_lannister_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.11.0/24
  red_targaryen_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.12.0/24             
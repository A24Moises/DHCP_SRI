  #DNSSERVER:
  arya:
    build: ./docker/dnsserver
    container_name: arya
    hostname: arya
    networks: 
      stark.net:
        ipv4_address: 192.168.10.10  
    volumes:
      - ./dnsserver/named.conf.local:/etc/bind/named.conf.local
      - ./dnsserver/zonas:/var/cache/bind/zonas          
  #KEA
  ned:
    build: ./docker/kea
    container_name: ned
    hostname: ned
    networks:
      stark_net:
        ipv4_address: 192.168.10.2
    volumes:
      - ./dhcp/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf
      - ./dhcp/kea-dhcp-ddns.conf.json:/etc/kea/kea-dhcp-ddns.conf
      - /var/log/dhcp.log:/var/log/dhcp.log
  
  #CLIENTES STARK
  bran:
    build: ./docker/cliente
    container_name: bran
    mac_address: 02:42:ac:11:00:10  # dirección HW fija
    networks:
      stark_net:
        ipv4_address: 192.168.130.221
        
    command: >
      sh -c "slepp 5 seg" "dhclient -v eth0 && sleep infinity"
    cap_add:
      - 
  jon:
    build: ./docker/cliente
    container_name: jon
    networks:
      stark_net:
    command: sh -c "dhclient -v eth0 && sleep infinity"

  sansa:
    build: ./docker/cliente
    container_name: sansa
    networks:
      stark_net:
    command: sh -c "dhclient -v eth0 && sleep infinity"

  robb:
    build: ./docker/cliente
    container_name: robb
    networks:
      stark_net:
    command: sh -c "dhclient -v eth0 && sleep infinity"

  # Cliente Red Lannister
  jamie:
    build: ./docker/cliente
    container_name: jamie
    networks:
      lannister_net:
    command: sh -c "dhclient -v eth0 && sleep infinity"

  # Cliente Red Targaryen
  daenerys:
    build: ./docker/cliente
    container_name: daenerys
    networks:
      targaryen_net:
    command: sh -c "dhclient -v eth0 && sleep infinity"
    
networks:
  stark_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  lannister_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.11.0/24

  targaryen_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.12.0/24             
  #DNSSERVER:
  arya:
    build: ./docker/dnsserver
    container_name: arya
    hostname: arya
    networks: 
      stark_net:
        ipv4_address: 192.168.10.10  
    volumes:
      - ./dnsserver/named.conf.local:/etc/bind/named.conf.local
      - ./dnsserver/zonas:/var/cache/bind/zonas          
  #KEA
  ned:
    build: ./docker/kea
    container_name: ned
    hostname: ned
    networks:
      stark_net:
        ipv4_address: 192.168.10.2
    volumes:
      - ./dhcp/kea-dhcp4.conf.json:/etc/kea/kea-dhcp4.conf

  
  #CLIENTES STARK
  bran:
    build: ./docker/cliente
    container_name: bran
    networks:
      stark_net:
        ipv4_address: 192.168.10.11
        mac_address: 02:42:ac:11:00:10  # dirección HW fija

    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  jon:
    build: ./docker/cliente
    container_name: jon
    networks:
      stark_net:
    
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  sansa:
    build: ./docker/cliente
    container_name: sansa
    networks:
      stark_net:
       
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  robb:
    build: ./docker/cliente
    container_name: robb
    networks:
      stark_net:
        
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  # Cliente Red Lannister
  jamie:
    build: ./docker/cliente
    container_name: jamie
    networks:
      lannister_net:
        
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned

  # Cliente Red Targaryen
  daenerys:
    build: ./docker/cliente
    container_name: daenerys
    networks:
      targaryen_net:
        
    command: >
      sh -c "ip addr flush dev eth0 && dhclient -v eth0 && sleep infinity"
    cap_add:
      - NET_ADMIN
    depends_on:
      - ned
      
#REDES    
networks:
  wan:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
  stark_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
  lannister_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.11.0/24
  targaryen_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.12.0/24             